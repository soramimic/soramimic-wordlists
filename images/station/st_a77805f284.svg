<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><title>鹿折唐桑駅のイメージ画像</title><desc>駅名とかな読みを置いただけの、どの鉄道会社のものでもない駅名標のイメージです。写真ではなく、実在の社章・路線記号・ラインカラーも使っていません。帯の色は路線名から機械的に決めたものです。</desc><g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif"><rect x="0" y="0" width="320" height="200" rx="16" fill="#f1eaf1"/><g fill="#9f939f"><rect x="94" y="146" width="10" height="42" rx="3"/><rect x="216" y="146" width="10" height="42" rx="3"/></g><rect x="16" y="30" width="288" height="124" rx="10" fill="#ffffff" stroke="#81377f" stroke-width="2"/><path d="M16 46V40a10 10 0 0 1 10-10h268a10 10 0 0 1 10 10v6Z" fill="#81377f"/><path d="M16 142h288v2a10 10 0 0 1 -10 10h-268a10 10 0 0 1 -10-10Z" fill="#cb86ca"/><text x="160" y="106.7" text-anchor="middle" font-size="46" font-weight="700" fill="#2a222a">鹿折唐桑</text><text x="160" y="126" text-anchor="middle" font-size="16" fill="#655365">ししおりからくわ</text><rect x="240" y="4" width="70" height="22" rx="11" fill="#4f224e"/><text x="275" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">イメージ</text><rect x=".5" y=".5" width="319" height="199" rx="15.5" fill="none" stroke="#e2d5e2"/></g></svg>
