name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0

      - name: Validate CSVs
        run: python tools/validate_csvs.py

      - name: Test Release image source manifest tooling
        run: python -m unittest tools/test_release_image_manifest.py

      - name: Validate sekitsui family generated images
        run: python tools/validate_sekitsui_generated_images.py

      - name: Test sekitsui manual overrides
        working-directory: tools
        run: python -m unittest test_sekitsui_overrides.py

      - name: Test sekitsui family generated image tooling
        run: >-
          python -m unittest
          tools/test_plan_sekitsui_generated_images.py
          tools/test_apply_sekitsui_generated_images.py
          tools/test_materialize_sekitsui_generated_images.py

      - name: Validate plant family generated images
        run: python tools/validate_plant_generated_images.py

      - name: Test plant taxonomy and family generated image tooling
        run: >-
          python -m unittest
          tools/test_enrich_plant_entities.py
          tools/test_enrich_plant_images.py
          tools/test_plant_overrides.py
          tools/test_update_plant_schema.py
          tools/test_plan_plant_generated_images.py
          tools/test_apply_plant_generated_images.py
          tools/test_materialize_plant_generated_images.py

      - name: Test semantic image replacements
        run: python -m unittest tools/test_apply_gimukyoiku_semantic_images.py

      - name: Test scientist updater
        run: python tools/test_update_scientist.py

      - name: Test YouTuber channel and subscriber updaters
        run: >-
          python -m unittest
          tools/test_apply_youtuber_hololive_images.py
          tools/test_apply_youtuber_nijisanji_images.py
          tools/test_apply_youtuber_permitted_images.py
          tools/test_enrich_youtuber_images.py
          tools/test_update_nijisanji.py
          tools/test_update_youtuber.py
          tools/test_update_youtuber_japan.py
          tools/test_update_youtuber_scope.py
          tools/test_update_youtuber_subscribers.py
          tools/test_discover_youtuber_channels.py

      - name: Test myoji evidence updater
        run: python -m unittest tools/test_update_myoji.py

      - name: Test municipality updater
        run: python tools/test_update_municipality.py

      - name: Test school updater
        run: python tools/test_update_school.py

      - name: Test player description helpers
        run: >-
          python -m unittest
          tools/test_wpnames.py
          tools/test_enrich_player_descriptions.py
          tools/test_rebuild_football_jleague.py
          tools/test_validate_csvs.py

      - name: Test source-grounded OpenAI description selection
        run: |
          python -m unittest \
            tools/test_openai_source_selector.py \
            tools/test_enrich_player_descriptions_openai.py
          python tools/validate_openai_player_description_sources.py

      - name: Test player position helpers
        run: python -m unittest tools/test_enrich_player_positions.py

      - name: Test marine life updater
        run: >-
          python -m unittest
          tools/test_update_marine_life.py
          tools/test_enrich_marine_life_descriptions.py
          tools/test_enrich_marine_life_wikipedia_descriptions.py
          tools/test_prepare_marine_generated_fallback.py

      - name: Verify marine life generated CSV
        run: python tools/update_marine_life.py --check
