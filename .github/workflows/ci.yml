name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0

      - name: Validate CSVs
        run: python tools/validate_csvs.py

      - name: Test Release image source manifest tooling
        run: python -m unittest tools/test_release_image_manifest.py

      - name: Validate sekitsui family generated images
        run: python tools/validate_sekitsui_generated_images.py

      - name: Test sekitsui family generated image tooling
        run: >-
          python -m unittest
          tools/test_plan_sekitsui_generated_images.py
          tools/test_apply_sekitsui_generated_images.py
          tools/test_materialize_sekitsui_generated_images.py

      - name: Test semantic image replacements
        run: python -m unittest tools/test_apply_gimukyoiku_semantic_images.py

      - name: Test scientist updater
        run: python tools/test_update_scientist.py

      - name: Test YouTuber channel and subscriber updaters
        run: >-
          python -m unittest
          tools/test_update_youtuber_subscribers.py
          tools/test_discover_youtuber_channels.py

      - name: Test myoji evidence updater
        run: >-
          python -m unittest
          tools/test_update_myoji.py
          tools/test_audit_myoji_official_web.py

      - name: Test 2012 phonebook surname pilot
        run: python -m unittest tools/test_pilot_jpon_2012_surnames.py

      - name: Validate myoji official web search batch
        run: python tools/audit_myoji_official_web.py validate --all

      - name: Test myoji general web research tooling
        run: >-
          python -m unittest
          tools/test_apply_myoji_negative_reviews.py
          tools/test_apply_myoji_result_url_audit.py
          tools/test_apply_myoji_review_rejections_to_ledger.py
          tools/test_apply_myoji_url_audit.py
          tools/test_audit_myoji_evidence_urls.py
          tools/test_audit_myoji_negative_result_urls.py
          tools/test_audit_myoji_web_research.py
          tools/test_bing_search_runner.py
          tools/test_duckduckgo_html_runner.py
          tools/test_finalize_myoji_negative_audits.py
          tools/test_generate_myoji_negative_pass_candidates.py
          tools/test_generate_myoji_reaudit_candidates.py
          tools/test_google_search_runner.py
          tools/test_official_domain_search_runner.py
          tools/test_repair_myoji_result_metadata.py
          tools/test_sanitize_myoji_search_receipts.py
          tools/test_validate_myoji_evidence_ledger.py
          tools/test_yahoo_japan_search_runner.py

      - name: Validate myoji general web research batches
        run: |
          python tools/audit_myoji_web_research.py validate-all
          python tools/audit_myoji_web_research.py validate-evidence

      - name: Test municipality updater
        run: python tools/test_update_municipality.py

      - name: Test school updater
        run: python tools/test_update_school.py

      - name: Test player description helpers
        run: python -m unittest tools/test_wpnames.py

      - name: Test player position helpers
        run: python -m unittest tools/test_enrich_player_positions.py

      - name: Test marine life updater
        run: >-
          python -m unittest
          tools/test_update_marine_life.py
          tools/test_enrich_marine_life_descriptions.py
          tools/test_enrich_marine_life_wikipedia_descriptions.py
          tools/test_prepare_marine_generated_fallback.py

      - name: Verify marine life generated CSV
        run: python tools/update_marine_life.py --check
