name: update-wordlists

on:
  schedule:
    - cron: "0 21 5 * *" # 毎月6日 6:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 各updaterは continue-on-error で独立させ、1つの失敗で全体が
      # 止まらないようにする。失敗したupdaterの出力は後段で巻き戻す
      - name: Update pokemon.csv (PokéAPI)
        id: pokemon
        continue-on-error: true
        run: python tools/update_pokemon.py

      - name: Update nations.csv (mledoze/countries)
        id: nations
        continue-on-error: true
        run: python tools/update_nations.py && python tools/enrich_nations.py

      - name: Update stations.csv (Wikidata/Wikipedia)
        id: stations
        continue-on-error: true
        run: python tools/update_stations.py

      - name: Update baseball.csv (Wikipedia rosters)
        id: baseball
        continue-on-error: true
        run: python tools/update_baseball.py

      - name: Update football.csv (Wikipedia rosters)
        id: football
        continue-on-error: true
        run: python tools/update_football.py

      - name: Update scientist.csv (Wikidata/Wikipedia)
        id: scientist
        continue-on-error: true
        run: python tools/update_scientist.py

      - name: Update sekitsui.csv (Wikidata taxa)
        id: sekitsui
        continue-on-error: true
        run: python tools/update_sekitsui.py

      - name: Update plant.csv (Wikidata taxa)
        id: plant
        continue-on-error: true
        run: python tools/update_plant.py

      - name: Enrich plant taxonomy and verified photos
        id: plantmeta
        continue-on-error: true
        run: |
          python tools/enrich_plant_entities.py
          python tools/enrich_plant_taxonomy.py
          python tools/enrich_plant_images.py

      - name: Update insect.csv (Wikidata taxa)
        id: insect
        continue-on-error: true
        run: python tools/update_insect.py

      - name: Update municipality.csv (総務省コード表/Wikidata/Wikipedia)
        id: municipality
        continue-on-error: true
        run: python tools/update_municipality.py

      - name: Update youtuber.csv (Wikidata/Wikipedia/official rosters)
        id: youtuber
        continue-on-error: true
        run: |
          python tools/update_youtuber.py
          # 個別記事のない現所属ライバーは、公式名簿・プロフィールから補完する。
          python tools/update_nijisanji.py
          # 新規人物にも同じ更新内で必ず象徴カードを付け、画像100%を維持する。
          python tools/gen_youtuber_cards.py --prune
          # 目視確認済みの非営利ファンメイド画像だけを象徴カードへ上書きする。
          python tools/apply_youtuber_permitted_images.py

      # 登録者数は時変値なので毎回全行を上書きする(ADR 00030)。
      # secrets.YOUTUBE_API_KEY が未設定(forkなど)ならスクリプト側が
      # 「スキップ」を出して正常終了する
      - name: Update youtuber subscribers (YouTube Data API)
        id: ytsubs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python tools/discover_youtuber_channels.py
          python tools/update_youtuber_subscribers.py

      # 文科省の学校コード一覧(約6万校)から全件再生成する。Wikipediaの冒頭文
      # 取得が支配的で30分前後かかるので、他のupdaterの後に置く
      - name: Update school.csv (文科省 学校コード/Wikidata/Wikipedia)
        id: school
        continue-on-error: true
        run: python tools/update_school.py

      - name: Backfill images (Wikidata P18)
        id: images
        continue-on-error: true
        run: python tools/enrich_images.py

      - name: Backfill school/municipality images (Wikidata P18/P242)
        id: placeimages
        continue-on-error: true
        run: python tools/enrich_school_municipality_images.py

      - name: Apply school type images
        id: schooltypeimg
        continue-on-error: true
        run: python tools/apply_school_type_images.py

      # 実写が無い行に class ごとの概念イメージを割り当てる(ネットワーク不要)。
      # update_sekitsui / update_plant / update_insect が追記した新規行にも
      # この回で画像が付く
      - name: Apply class images (sekitsui/plant/insect)
        id: classimg
        continue-on-error: true
        run: |
          python tools/apply_class_images.py
          python tools/apply_sekitsui_generated_images.py
          python tools/apply_plant_generated_images.py

      - name: 失敗したupdaterの書きかけ出力を巻き戻す
        id: failures
        env:
          O_POKEMON: ${{ steps.pokemon.outcome }}
          O_NATIONS: ${{ steps.nations.outcome }}
          O_STATIONS: ${{ steps.stations.outcome }}
          O_BASEBALL: ${{ steps.baseball.outcome }}
          O_FOOTBALL: ${{ steps.football.outcome }}
          O_SCIENTIST: ${{ steps.scientist.outcome }}
          O_SEKITSUI: ${{ steps.sekitsui.outcome }}
          O_PLANT: ${{ steps.plant.outcome }}
          O_PLANTMETA: ${{ steps.plantmeta.outcome }}
          O_INSECT: ${{ steps.insect.outcome }}
          O_MUNICIPALITY: ${{ steps.municipality.outcome }}
          O_YOUTUBER: ${{ steps.youtuber.outcome }}
          O_YTSUBS: ${{ steps.ytsubs.outcome }}
          O_SCHOOL: ${{ steps.school.outcome }}
          O_IMAGES: ${{ steps.images.outcome }}
          O_PLACEIMAGES: ${{ steps.placeimages.outcome }}
          O_SCHOOLTYPEIMG: ${{ steps.schooltypeimg.outcome }}
          O_CLASSIMG: ${{ steps.classimg.outcome }}
        run: |
          failed=""
          revert_if_failed() {
            # $1=表示名 $2=outcome $3以降=巻き戻すファイル(省略時は戻さない)
            name="$1"; outcome="$2"; shift 2
            if [ "$outcome" = "failure" ]; then
              if [ $# -gt 0 ]; then git checkout -- "$@"; fi
              failed="$failed $name"
            fi
          }
          revert_if_failed pokemon "$O_POKEMON" pokemon.csv
          revert_if_failed nations "$O_NATIONS" nations.csv tools/nations_map.csv
          revert_if_failed stations "$O_STATIONS" stations.csv
          revert_if_failed baseball "$O_BASEBALL" baseball.csv
          revert_if_failed football "$O_FOOTBALL" football.csv
          revert_if_failed scientist "$O_SCIENTIST" scientist.csv
          revert_if_failed sekitsui "$O_SEKITSUI" sekitsui.csv
          revert_if_failed plant "$O_PLANT" plant.csv
          revert_if_failed plant_metadata "$O_PLANTMETA" plant.csv
          revert_if_failed insect "$O_INSECT" insect.csv
          revert_if_failed municipality "$O_MUNICIPALITY" municipality.csv
          revert_if_failed youtuber "$O_YOUTUBER" youtuber.csv \
            tools/youtuber_colors.json tools/youtuber_channel_sources.jsonl \
            images/youtuber
          # カード生成が途中で失敗した場合の未追跡SVGも、この専用ディレクトリ
          # に限って除く。既存ファイルは上のcheckoutで戻る。
          if [ "$O_YOUTUBER" = "failure" ]; then
            git clean -f -- images/youtuber
          fi
          # CSVは全API取得と監査台帳生成の成功後に原子的に書く。失敗時は同じ回の
          # update_youtuberによる追記を守るためCSVを戻さず、先行して更新されうる
          # チャンネル根拠/候補台帳だけを巻き戻す。
          revert_if_failed youtuber_subscribers "$O_YTSUBS" \
            tools/youtuber_channel_sources.jsonl \
            tools/youtuber_channel_candidates.jsonl
          revert_if_failed school "$O_SCHOOL" school.csv
          # enrich_imagesは複数ファイルを触るため巻き戻さない(他updaterの
          # 成果を消すおそれ)。破壊は次の行数チェックとvalidateで検出する
          revert_if_failed enrich_images "$O_IMAGES"
          # 2つのCSVを触るため、片方のupdaterの成果まで消さないよう巻き戻さない。
          revert_if_failed school_municipality_images "$O_PLACEIMAGES"
          # school updater/実写補完の成果を巻き戻さないよう、失敗だけを記録する。
          revert_if_failed school_type_images "$O_SCHOOLTYPEIMG"
          # 概念イメージの割り当てはsekitsui/plant/insectのCSVのみを書き換える
          # ので巻き戻せる(同回のupdate_*の追記も一緒に戻るが、次回の実行で
          # 復帰する)
          revert_if_failed class_images "$O_CLASSIMG" sekitsui.csv plant.csv insect.csv
          failed="${failed# }"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then echo "::warning::失敗したupdater: $failed"; fi

      - name: 行数が減っていないか確認(書きかけ・データ破壊の防止)
        run: |
          for f in *.csv tools/nations_map.csv; do
            old=$(git show "HEAD:$f" | wc -l)
            new=$(wc -l < "$f")
            if [ "$new" -lt "$old" ]; then
              echo "::error::$f の行数が減少 ($old -> $new 行)。破壊的変更の可能性があるため中断"
              exit 1
            fi
          done

      - name: Validate CSVs
        run: python tools/validate_csvs.py

      # GITHUB_TOKENで作ったPRではpull_request系ワークフロー
      # (ci / automerge / review-auto-update)が走らないため、
      # GitHub Appトークン(無期限) > AUTOMERGE_PAT(要年次更新) > github.token
      # の優先順で使う。App設定: vars.BOT_APP_ID + secrets.BOT_APP_PRIVATE_KEY
      - name: Generate GitHub App token
        id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Create pull request if changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || (secrets.AUTOMERGE_PAT != '' && secrets.AUTOMERGE_PAT) || github.token }}
          branch: auto/update-wordlists
          title: "自動更新: 単語リスト(月次バッチ)"
          commit-message: "自動更新: 単語リスト(月次バッチ)"
          body: |
            定期バッチ(update-wordlists)による自動更新です。
            AIレビュー(review-auto-update)を含む全チェックが成功すれば自動マージされます。
            ${{ steps.failures.outputs.failed != '' && format('⚠ 失敗したupdaterがあります: {0}。今回このリストは更新されていません。ワークフローログを確認してください(自動マージはされません)。', steps.failures.outputs.failed) || '' }}
          delete-branch: true

      - name: updater失敗をジョブ失敗として通知(メール用)
        if: steps.failures.outputs.failed != ''
        run: |
          echo "::error::失敗したupdater: ${{ steps.failures.outputs.failed }}"
          exit 1
