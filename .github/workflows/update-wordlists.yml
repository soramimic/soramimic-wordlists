name: update-wordlists

on:
  schedule:
    - cron: "0 21 5 * *" # 毎月6日 6:00 JST
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

# 月次更新と手動再実行のclaim競合を避けるため直列化する。
concurrency:
  group: update-wordlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 各updaterは continue-on-error で独立させ、1つの失敗で全体が
      # 止まらないようにする。失敗したupdaterの出力は後段で巻き戻す
      - name: Update pokemon.csv (PokéAPI)
        id: pokemon
        continue-on-error: true
        run: python tools/update_pokemon.py

      - name: Update nations.csv (mledoze/countries)
        id: nations
        continue-on-error: true
        run: python tools/update_nations.py && python tools/enrich_nations.py

      - name: Update stations.csv (Wikidata/Wikipedia)
        id: stations
        continue-on-error: true
        run: python tools/update_stations.py

      - name: Update baseball.csv (Wikipedia rosters)
        id: baseball
        continue-on-error: true
        run: python tools/update_baseball.py

      - name: Update football.csv (Wikipedia rosters)
        id: football
        continue-on-error: true
        run: python tools/update_football.py

      - name: Update scientist.csv (Wikidata/Wikipedia)
        id: scientist
        continue-on-error: true
        run: python tools/update_scientist.py

      - name: Update sekitsui.csv (Wikidata taxa)
        id: sekitsui
        continue-on-error: true
        run: python tools/update_sekitsui.py

      - name: Update plant.csv (Wikidata taxa)
        id: plant
        continue-on-error: true
        run: python tools/update_plant.py

      - name: Enrich plant taxonomy and verified photos
        id: plantmeta
        continue-on-error: true
        run: |
          python tools/enrich_plant_entities.py
          python tools/enrich_plant_taxonomy.py
          python tools/enrich_plant_images.py

      - name: Update insect.csv (Wikidata taxa)
        id: insect
        continue-on-error: true
        run: python tools/update_insect.py

      - name: Update municipality.csv (総務省コード表/Wikidata/Wikipedia)
        id: municipality
        continue-on-error: true
        run: python tools/update_municipality.py

      - name: Update youtuber.csv and vtuber.csv (Wikidata/Wikipedia/official rosters)
        id: youtuber
        continue-on-error: true
        run: |
          python tools/update_youtuber.py
          # 個別記事のない現所属ライバーは、公式名簿・プロフィールから補完する。
          python tools/update_nijisanji.py
          # 公式プロフィールとチャンネルを本人確認に使い、人物名だけを補完する。
          python tools/update_youtuber_japan.py
          # 国内向けと海外中心を利用側で絞り込めるよう活動圏を付与する。
          python tools/update_youtuber_scope.py
          # 新規人物にも同じ更新内で必ず象徴カードを付け、画像100%を維持する。
          python tools/gen_youtuber_cards.py --prune
          # 目視確認済みの非営利ファンメイド画像だけを象徴カードへ上書きする。
          python tools/apply_youtuber_permitted_images.py
          # 確認済みの公式プロフィール画像と公式名簿の補完行を反映する。
          python tools/apply_youtuber_hololive_images.py
          python tools/apply_youtuber_nijisanji_images.py

      # 登録者数は時変値なので毎回全行を上書きする(ADR 00030)。
      # secrets.YOUTUBE_API_KEY が未設定(forkなど)ならスクリプト側が
      # 「スキップ」を出して正常終了する
      - name: Update YouTuber and VTuber subscribers (YouTube Data API)
        id: ytsubs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python tools/discover_youtuber_channels.py
          python tools/update_youtuber_subscribers.py

      # 文科省の学校コード一覧(約6万校)から全件再生成する。Wikipediaの冒頭文
      # 取得が支配的で30分前後かかるので、他のupdaterの後に置く
      - name: Update school.csv (文科省 学校コード/Wikidata/Wikipedia)
        id: school
        continue-on-error: true
        run: python tools/update_school.py

      - name: Backfill images (Wikidata P18)
        id: images
        continue-on-error: true
        run: python tools/enrich_images.py

      - name: Backfill school/municipality images (Wikidata P18/P242)
        id: placeimages
        continue-on-error: true
        run: python tools/enrich_school_municipality_images.py

      - name: Apply school type images
        id: schooltypeimg
        continue-on-error: true
        run: python tools/apply_school_type_images.py

      # 実写が無い行に class ごとの概念イメージを割り当てる(ネットワーク不要)。
      # update_sekitsui / update_plant / update_insect が追記した新規行にも
      # この回で画像が付く
      - name: Apply class images (sekitsui/plant/insect)
        id: classimg
        continue-on-error: true
        run: |
          python tools/apply_class_images.py
          python tools/apply_sekitsui_generated_images.py
          python tools/apply_plant_generated_images.py

      - name: Set OpenAI enrichment cache date
        id: openai-cache-date
        if: vars.OPENAI_LLM_ENRICHMENT_ENABLED == 'true'
        run: echo "utc=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # 成功済みresponseと未解決reservationをbest-effortで再利用するcache。
      # branch scope/post-job保存なので、安全境界は後段のartifact claimが担う。
      - name: Restore OpenAI enrichment cache and token ledger
        if: vars.OPENAI_LLM_ENRICHMENT_ENABLED == 'true'
        uses: actions/cache@v4
        with:
          path: |
            tools/.cache/openai-source-selector.sqlite3
            tools/.cache/player_descriptions.json
          key: openai-description-${{ steps.openai-cache-date.outputs.utc }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openai-description-${{ steps.openai-cache-date.outputs.utc }}-
            openai-description-

      - name: Preflight newly added player description batch
        id: openaipreflight
        if: >-
          vars.OPENAI_LLM_ENRICHMENT_ENABLED == 'true' &&
          steps.baseball.outcome == 'success' &&
          steps.football.outcome == 'success'
        continue-on-error: true
        run: |
          python tools/enrich_player_descriptions_openai.py baseball --changed-from HEAD --limit 100
          python tools/enrich_player_descriptions_openai.py football --changed-from HEAD --limit 100

      # Actions cacheはbranch scopeかつpost-job保存なので、使用量の安全境界には
      # 使わない。repository全体から見えるimmutable artifactをAPI送信前に作り、
      # 当日分とrunner消失時の翌日guardを明示的に検証する。
      - name: Check repository-wide OpenAI run claim
        id: openaiclaimcheck
        if: >-
          vars.OPENAI_LLM_ENRICHMENT_ENABLED == 'true' &&
          steps.baseball.outcome == 'success' &&
          steps.football.outcome == 'success' &&
          steps.openaipreflight.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          utc=$(date -u +%F)
          next_utc=$(date -u -d "$utc + 1 day" +%F)
          echo "utc=$utc" >> "$GITHUB_OUTPUT"
          echo "next_utc=$next_utc" >> "$GITHUB_OUTPUT"
          existing=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=openai-description-claim-$utc&per_page=100" \
            --jq ".artifacts[] | select(.expired == false) | .id" \
            | head -n 1)
          if [ -n "$existing" ]; then
            echo "::error::同じUTC日のOpenAI補完claimが既にあります: $existing"
            exit 1
          fi

      - name: Prepare OpenAI run claim artifacts
        if: >-
          steps.openaiclaimcheck.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/openai-claim-current" "$RUNNER_TEMP/openai-claim-next"
          echo "${{ github.run_id }}:${{ github.run_attempt }}" > "$RUNNER_TEMP/openai-claim-current/run"
          echo "${{ github.run_id }}:${{ github.run_attempt }}" > "$RUNNER_TEMP/openai-claim-next/run"

      - name: Upload current OpenAI run claim before API use
        id: openaiclaimcurrent
        if: >-
          steps.openaiclaimcheck.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: openai-description-claim-${{ steps.openaiclaimcheck.outputs.utc }}
          path: ${{ runner.temp }}/openai-claim-current/run
          if-no-files-found: error
          retention-days: 2

      - name: Upload next-day OpenAI guard before API use
        id: openaiclaimnext
        if: >-
          steps.openaiclaimcurrent.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: openai-description-claim-${{ steps.openaiclaimcheck.outputs.next_utc }}
          path: ${{ runner.temp }}/openai-claim-next/run
          if-no-files-found: error
          retention-days: 3

      - name: Verify OpenAI run claim artifacts and UTC date
        id: openaiclaimverify
        if: >-
          steps.openaiclaimcurrent.outcome == 'success' &&
          steps.openaiclaimnext.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ID: ${{ steps.openaiclaimcurrent.outputs.artifact-id }}
          NEXT_ID: ${{ steps.openaiclaimnext.outputs.artifact-id }}
          EXPECTED_UTC: ${{ steps.openaiclaimcheck.outputs.utc }}
          EXPECTED_NEXT_UTC: ${{ steps.openaiclaimcheck.outputs.next_utc }}
        run: |
          [ "$(date -u +%F)" = "$EXPECTED_UTC" ] || {
            echo "::error::claim作成中にUTC日付が変わりました"; exit 1;
          }
          current_name=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_ID" --jq .name)
          next_name=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NEXT_ID" --jq .name)
          current_expired=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_ID" --jq .expired)
          next_expired=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NEXT_ID" --jq .expired)
          current_expires_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CURRENT_ID" --jq .expires_at)
          next_expires_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NEXT_ID" --jq .expires_at)
          [ "$current_name" = "openai-description-claim-$EXPECTED_UTC" ]
          [ "$next_name" = "openai-description-claim-$EXPECTED_NEXT_UTC" ]
          [ "$current_expired" = "false" ] && [ "$next_expired" = "false" ]
          python3 - "$EXPECTED_UTC" "$current_expires_at" \
            "$EXPECTED_NEXT_UTC" "$next_expires_at" <<'PY'
          import datetime
          import sys

          for day, expires_at in zip(sys.argv[1::2], sys.argv[2::2]):
              deadline = datetime.datetime.combine(
                  datetime.date.fromisoformat(day) + datetime.timedelta(days=1),
                  datetime.time.min,
                  tzinfo=datetime.timezone.utc,
              )
              expiry = datetime.datetime.fromisoformat(expires_at.replace("Z", "+00:00"))
              if expiry < deadline:
                  raise SystemExit(f"artifact expires before UTC guard completes: {day}")
          PY

      - name: Improve newly added player descriptions from verified source text
        id: openaidesc
        if: >-
          vars.OPENAI_LLM_ENRICHMENT_ENABLED == 'true' &&
          steps.baseball.outcome == 'success' &&
          steps.football.outcome == 'success' &&
          steps.openaipreflight.outcome == 'success' &&
          steps.openaiclaimverify.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DATA_SHARING_INCENTIVE_CONFIRMED_UNTIL: ${{ vars.OPENAI_DATA_SHARING_INCENTIVE_CONFIRMED_UNTIL }}
        run: |
          python tools/enrich_player_descriptions_openai.py all --fetch --changed-from HEAD --limit 100
          python tools/enrich_player_descriptions_openai.py all --apply --cache-only --changed-from HEAD --limit 100

      - name: 失敗したupdaterの書きかけ出力を巻き戻す
        id: failures
        env:
          O_POKEMON: ${{ steps.pokemon.outcome }}
          O_NATIONS: ${{ steps.nations.outcome }}
          O_STATIONS: ${{ steps.stations.outcome }}
          O_BASEBALL: ${{ steps.baseball.outcome }}
          O_FOOTBALL: ${{ steps.football.outcome }}
          O_SCIENTIST: ${{ steps.scientist.outcome }}
          O_SEKITSUI: ${{ steps.sekitsui.outcome }}
          O_PLANT: ${{ steps.plant.outcome }}
          O_PLANTMETA: ${{ steps.plantmeta.outcome }}
          O_INSECT: ${{ steps.insect.outcome }}
          O_MUNICIPALITY: ${{ steps.municipality.outcome }}
          O_YOUTUBER: ${{ steps.youtuber.outcome }}
          O_YTSUBS: ${{ steps.ytsubs.outcome }}
          O_SCHOOL: ${{ steps.school.outcome }}
          O_IMAGES: ${{ steps.images.outcome }}
          O_PLACEIMAGES: ${{ steps.placeimages.outcome }}
          O_SCHOOLTYPEIMG: ${{ steps.schooltypeimg.outcome }}
          O_CLASSIMG: ${{ steps.classimg.outcome }}
          O_OPENAIPREFLIGHT: ${{ steps.openaipreflight.outcome }}
          O_OPENAICLAIMCHECK: ${{ steps.openaiclaimcheck.outcome }}
          O_OPENAICLAIMCURRENT: ${{ steps.openaiclaimcurrent.outcome }}
          O_OPENAICLAIMNEXT: ${{ steps.openaiclaimnext.outcome }}
          O_OPENAICLAIMVERIFY: ${{ steps.openaiclaimverify.outcome }}
          O_OPENAIDESC: ${{ steps.openaidesc.outcome }}
        run: |
          failed=""
          revert_if_failed() {
            # $1=表示名 $2=outcome $3以降=巻き戻すファイル(省略時は戻さない)
            name="$1"; outcome="$2"; shift 2
            if [ "$outcome" = "failure" ]; then
              if [ $# -gt 0 ]; then git checkout -- "$@"; fi
              failed="$failed $name"
            fi
          }
          revert_if_failed pokemon "$O_POKEMON" pokemon.csv
          revert_if_failed nations "$O_NATIONS" nations.csv tools/nations_map.csv
          revert_if_failed stations "$O_STATIONS" stations.csv
          revert_if_failed baseball "$O_BASEBALL" baseball.csv
          revert_if_failed football "$O_FOOTBALL" football.csv
          revert_if_failed scientist "$O_SCIENTIST" scientist.csv
          revert_if_failed sekitsui "$O_SEKITSUI" sekitsui.csv
          revert_if_failed plant "$O_PLANT" plant.csv
          revert_if_failed plant_metadata "$O_PLANTMETA" plant.csv
          revert_if_failed insect "$O_INSECT" insect.csv
          revert_if_failed municipality "$O_MUNICIPALITY" municipality.csv
          revert_if_failed youtuber "$O_YOUTUBER" youtuber.csv vtuber.csv \
            tools/youtuber_colors.json tools/youtuber_channel_sources.jsonl \
            images/youtuber
          # カード生成が途中で失敗した場合の未追跡SVGも、この専用ディレクトリ
          # に限って除く。既存ファイルは上のcheckoutで戻る。
          if [ "$O_YOUTUBER" = "failure" ]; then
            git clean -f -- images/youtuber
          fi
          # CSVは全API取得と監査台帳生成の成功後に原子的に書く。失敗時は同じ回の
          # update_youtuberによる追記を守るためCSVを戻さず、先行して更新されうる
          # チャンネル根拠/候補台帳だけを巻き戻す。
          revert_if_failed youtuber_subscribers "$O_YTSUBS" \
            tools/youtuber_channel_sources.jsonl \
            tools/youtuber_channel_candidates.jsonl
          revert_if_failed school "$O_SCHOOL" school.csv
          # enrich_imagesは複数ファイルを触るため巻き戻さない(他updaterの
          # 成果を消すおそれ)。破壊は次の行数チェックとvalidateで検出する
          revert_if_failed enrich_images "$O_IMAGES"
          # 2つのCSVを触るため、片方のupdaterの成果まで消さないよう巻き戻さない。
          revert_if_failed school_municipality_images "$O_PLACEIMAGES"
          # school updater/実写補完の成果を巻き戻さないよう、失敗だけを記録する。
          revert_if_failed school_type_images "$O_SCHOOLTYPEIMG"
          # 概念イメージの割り当てはsekitsui/plant/insectのCSVのみを書き換える
          # ので巻き戻せる(同回のupdate_*の追記も一緒に戻るが、次回の実行で
          # 復帰する)
          revert_if_failed class_images "$O_CLASSIMG" sekitsui.csv plant.csv insect.csv
          revert_if_failed openai_description_preflight "$O_OPENAIPREFLIGHT"
          revert_if_failed openai_claim_check "$O_OPENAICLAIMCHECK"
          revert_if_failed openai_claim_current "$O_OPENAICLAIMCURRENT"
          revert_if_failed openai_claim_next "$O_OPENAICLAIMNEXT"
          revert_if_failed openai_claim_verify "$O_OPENAICLAIMVERIFY"
          # LLM取得はCSVを書かず、all applyはCSVと根拠台帳をbundle化し、失敗時に
          # apply直前の内容へ戻す。先行updaterの成果は保持される。
          revert_if_failed openai_player_descriptions "$O_OPENAIDESC"
          failed="${failed# }"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then echo "::warning::失敗したupdater: $failed"; fi

      - name: 行数が減っていないか確認(書きかけ・データ破壊の防止)
        run: |
          for f in *.csv tools/nations_map.csv; do
            old=$(git show "HEAD:$f" | wc -l)
            new=$(wc -l < "$f")
            if [ "$new" -lt "$old" ]; then
              echo "::error::$f の行数が減少 ($old -> $new 行)。破壊的変更の可能性があるため中断"
              exit 1
            fi
          done

      - name: Validate CSVs
        run: python tools/validate_csvs.py

      # GITHUB_TOKENで作ったPRではpull_request系ワークフロー
      # (ci / automerge / review-auto-update)が走らないため、
      # GitHub Appトークン(無期限) > AUTOMERGE_PAT(要年次更新) > github.token
      # の優先順で使う。App設定: vars.BOT_APP_ID + secrets.BOT_APP_PRIVATE_KEY
      - name: Generate GitHub App token
        id: app-token
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Create pull request if changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || (secrets.AUTOMERGE_PAT != '' && secrets.AUTOMERGE_PAT) || github.token }}
          branch: auto/update-wordlists
          title: "自動更新: 単語リスト(月次バッチ)"
          commit-message: "自動更新: 単語リスト(月次バッチ)"
          body: |
            定期バッチ(update-wordlists)による自動更新です。
            AIレビュー(review-auto-update)を含む全チェックが成功すれば自動マージされます。
            ${{ steps.failures.outputs.failed != '' && format('⚠ 失敗したupdaterがあります: {0}。今回このリストは更新されていません。ワークフローログを確認してください(自動マージはされません)。', steps.failures.outputs.failed) || '' }}
          delete-branch: true

      - name: updater失敗をジョブ失敗として通知(メール用)
        if: steps.failures.outputs.failed != ''
        run: |
          echo "::error::失敗したupdater: ${{ steps.failures.outputs.failed }}"
          exit 1
