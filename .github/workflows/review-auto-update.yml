# 自動更新PR(auto/update-wordlists)のAIレビュー。
# Gemini API(無料枠)で差分の追加行を確認し、問題なければジョブ成功、
# 不安があればPRにコメントしてジョブを失敗させる。
# マージ自体はautomerge.yamlが行う(このジョブが失敗すると自動マージされない)。
# 要リポジトリシークレット: GEMINI_API_KEY(https://aistudio.google.com/apikey)
name: review-auto-update
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'auto/update-wordlists'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: updater失敗を含むPRは自動マージさせない
        # イベントペイロードのbodyはブランチpush時点のスナップショットで、
        # create-pull-requestによる本文更新(数秒後)が反映されず競合する。
        # 必ずAPIで現在の本文を取得する
        run: |
          BODY=$(gh pr view "$PR" --repo "${{ github.repository }}" --json body -q .body)
          if printf '%s' "$BODY" | grep -q "失敗したupdaterがあります"; then
            echo "::error::updater失敗を含むPRのため、このチェックを失敗させて自動マージを止めます(内容とログを手動確認してください)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Geminiによる差分レビュー
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 無料枠で使えるモデルが変わったらリポジトリ変数GEMINI_MODELで上書き
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          gh pr diff "$PR" --repo "${{ github.repository }}" > pr.diff
          python tools/review_diff_gemini.py pr.diff -o verdict.json

      - name: 判定を反映(NGならコメントしてジョブを失敗させる)
        run: |
          if [ "$(jq -r .verdict verdict.json)" = "OK" ]; then
            echo "AIレビューOK。マージ可否はautomerge(全チェック成功待ち)に任せます"
          else
            {
              echo "🤖 AIレビュー(Gemini)が自動マージを見送りました。以下を確認してください:"
              echo
              jq -r '.reasons[] | "- " + .' verdict.json
              echo
              echo "問題なければ手動でマージしてください。"
            } > comment.md
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
            echo "::error::AIレビュー結果: NG — PRのコメントを確認してください(自動マージは行われません)"
            exit 1
          fi
